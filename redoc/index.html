<!DOCTYPE html>
<html>

<head>
	<title>Brise API - Redoc</title>
	<meta charset="utf-8" />
	<link rel="shortcut icon" href="../favicon.ico" />
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,700|Roboto:300,400,700" rel="stylesheet">
	<script src="https://unpkg.com/rapipdf/dist/rapipdf-min.js"></script>

	<style>
		body {
			margin: 0;
			padding: 0;
		}

		.footer {
			margin: 0px;
			padding: 10px 10px 10px 270px;
			background-color: rgb(250, 250, 250);
		}
	</style>
</head>

<body>
	<div id="redoc-container"></div>

	<script type="module">
		import { init } from 'https://cdn.jsdelivr.net/npm/redoc@3.0.1/bundles/redoc.standalone.js';

		const urlParams = new URLSearchParams(window.location.search);
		const specUrl   = urlParams.get('spec')      || '../brise.cloud.openapi.yaml';
		// colorMode passado pelo pai na carga inicial; padrao: 'system'
		let   colorMode = urlParams.get('colorMode') || 'system';

		// Chave do localStorage usada internamente pelo Redoc 3.x
		const COLOR_KEY = 'redoc.colorMode';

		// Inicializa o Redoc
		await init(specUrl, { colorMode }, document.getElementById('redoc-container'));

		// ── Notifica o frame pai quando o usuario muda o tema pelo switch do Redoc ──
		// O Redoc grava a preferencia em localStorage['redoc.colorMode']. Observamos essa chave e avisamos o pai via postMessage (sem reload).
		let lastColorMode = localStorage.getItem(COLOR_KEY) || colorMode;

		function notifyParentIfChanged() {
			const current = localStorage.getItem(COLOR_KEY) || colorMode;
			if (current !== lastColorMode) {
				lastColorMode = current;
				if (window.parent && window.parent !== window) {
					window.parent.postMessage({ type: 'colorModeChanged', colorMode: current }, '*');
				}
			}
		}

		// MutationObserver no <html>: Redoc 3.x altera atributos ao trocar tema
		const observer = new MutationObserver(notifyParentIfChanged);
		observer.observe(document.documentElement, {
			attributes: true,
			attributeFilter: ['data-color-mode', 'class', 'color-scheme']
		});

		// Fallback via polling
		setInterval(notifyParentIfChanged, 500);

		// ── Escuta pedido do pai para trocar colorMode SEM reload de pagina ──
		// O pai envia postMessage({type: 'setColorMode', colorMode: 'dark'|'light'|'system'}) e o Redoc e re-inicializado no mesmo container (re-renderização React, sem requisicao da HTML).
		window.addEventListener('message', async function (e) {
			if (!e.data || e.data.type !== 'setColorMode') return;
			colorMode = e.data.colorMode || 'system';
			lastColorMode = colorMode; // evita notificacao redundante de volta ao pai
			const container = document.getElementById('redoc-container');
			container.innerHTML = ''; // limpa antes de re-renderizar
			await init(specUrl, { colorMode }, container);
		});
	</script>

	<p class="footer">
		<rapi-pdf style="width:100%; height:40px; font-size:18px;" spec-url="../brise.cloud.openapi.yaml" button-bg="#b44646">
		</rapi-pdf>
	</p>

</body>

</html>
